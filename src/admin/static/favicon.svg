<svg id="centeredLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" width="100%" height="100%">
  <title>AI-EngKit</title>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"></feGaussianBlur>
      <feGaussianBlur stdDeviation="4" result="blur2"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur1"></feMergeNode>
        <feMergeNode in="blur2"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2025"></stop>
      <stop offset="100%" stop-color="#111215"></stop>
    </linearGradient>
    <linearGradient id="aiFaceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1a14"></stop>
      <stop offset="100%" stop-color="#3d2b12"></stop>
    </linearGradient>
    <linearGradient id="devFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3139"></stop>
      <stop offset="100%" stop-color="#16181d"></stop>
    </linearGradient>
    <linearGradient id="opsFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3326"></stop>
      <stop offset="100%" stop-color="#0a1d17"></stop>
    </linearGradient>
    <linearGradient id="aiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"></stop>
      <stop offset="100%" stop-color="#f59e0b"></stop>
    </linearGradient>
