name: dev

services:
  ai-dev:
    image: ai-engkit-ai-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OH_MY_OPENCODE_SLIM_VERSION=${OH_MY_OPENCODE_SLIM_VERSION:-2.2.20}
        - AI_ENGKIT_VERSION=dev
    container_name: ai-engkit-dev
    ports:
      - "${CHAMBER_DEV_PORT:-8001}:3000"
    volumes:
      - workspace-dev:/home/devuser/workspace
      - opencode-data-dev:/home/devuser/.local/share/opencode
      - lean-ctx-data-dev:/home/devuser/.local/share/lean-ctx
      - lean-ctx-state-dev:/home/devuser/.local/state/lean-ctx
      - lean-ctx-config-dev:/home/devuser/.config/lean-ctx
      - opencode-config-dev:/home/devuser/.config/opencode
      - omo-config-dev:/home/devuser/.omo
      - opencode-cache-dev:/home/devuser/.cache/opencode
      - ohmyopencode-cache-dev:/home/devuser/.cache/oh-my-opencode-slim
      - openchamber-data-dev:/home/devuser/.config/openchamber
      - git-config-dev:/home/devuser/.config/git
      - ssh-keys-dev:/home/devuser/.ssh
      - gh-config-dev:/home/devuser/.config/gh
      - glab-config-dev:/home/devuser/.config/glab-cli
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    environment:
      OPENCHAMBER_HOST: ${OPENCHAMBER_HOST:-0.0.0.0}
      OPENCODE_ENABLE_EXA: ${OPENCODE_ENABLE_EXA:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ai-admin:
    image: ai-engkit-ai-dev
    container_name: ai-engkit-admin-dev
    depends_on:
      - ai-dev
    working_dir: /opt/admin
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        set -e
        sudo chown -R devuser:devuser /opt/ai-engkit
        mkdir -p /opt/ai-engkit/backups
        [ -f /opt/ai-engkit/VERSION ] || echo dev > /opt/ai-engkit/VERSION
         [ -f /opt/ai-engkit/.env ] || env | grep -v -E '^(HOME|PATH|BUN_|NODE_|npm_|HOSTNAME|PWD|SHLVL|TERM|TZ|LS_COLORS|LESS[ _]|PAGER|EDITOR|LC_|LANG|SHELL|USER|SUDO_|TMPDIR|OLDPWD|_|LOGNAME|PLAYWRIGHT_|DEBIAN_|CLAUDE_)' > /opt/ai-engkit/.env
         if [ "$${OPENCODE_PROVIDER+x}" = x ]; then
           env_tmp="$$(mktemp /opt/ai-engkit/.env.sync.XXXXXX)"
           persisted_provider="$$(sed -n 's/^[[:space:]]*OPENCODE_PROVIDER=//p' /opt/ai-engkit/.env | tail -n 1)"
           merged_provider="$$(jq -cn \
             --arg persisted "$$persisted_provider" \
             --arg compose "$$OPENCODE_PROVIDER" \
             'def providers: try fromjson catch {} | if type == "object" then . else {} end; ($$persisted | providers) * ($$compose | providers)')"
           grep -vE '^[[:space:]]*OPENCODE_PROVIDER=' /opt/ai-engkit/.env > "$$env_tmp" || true
           printf 'OPENCODE_PROVIDER=%s\n' "$$merged_provider" >> "$$env_tmp"
           mv "$$env_tmp" /opt/ai-engkit/.env
         fi
         mkdir -p /opt/ai-engkit/admin-data
        if [ -d /opt/ai-engkit/provider-state/provider-keys.json ]; then mv /opt/ai-engkit/provider-state/provider-keys.json /opt/ai-engkit/provider-state/provider-keys.json.legacy.$$(date +%s); fi
        if [ -f /opt/ai-engkit/provider-state/provider-keys.json ] && [ ! -e /opt/ai-engkit/admin-data/provider-keys.json ]; then mv /opt/ai-engkit/provider-state/provider-keys.json /opt/ai-engkit/admin-data/provider-keys.json; fi
        if [ -f /opt/ai-engkit/provider-keys.json ] && [ ! -e /opt/ai-engkit/admin-data/provider-keys.json ]; then mv /opt/ai-engkit/provider-keys.json /opt/ai-engkit/admin-data/provider-keys.json; fi
        if [ -d /opt/ai-engkit/provider-keys.json ]; then mv /opt/ai-engkit/provider-keys.json /opt/ai-engkit/provider-keys.json.legacy.$$(date +%s); fi
        [ -f /opt/ai-engkit/admin-data/provider-keys.json ] || printf '%s\n' '{"providers":{}}' > /opt/ai-engkit/admin-data/provider-keys.json
        bun run /opt/admin/server.ts
    ports:
      - "${ADMIN_DEV_PORT:-8081}:8080"
    volumes:
      - admin-data-dev:/opt/ai-engkit
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ADMIN_PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-testadmin123}
      - AGENT_MODELS_DEBUG=1
    restart: unless-stopped

volumes:
  admin-data-dev:
  workspace-dev:
  opencode-data-dev:
  lean-ctx-data-dev:
  lean-ctx-state-dev:
  lean-ctx-config-dev:
  opencode-config-dev:
  omo-config-dev:
  opencode-cache-dev:
  ohmyopencode-cache-dev:
  openchamber-data-dev:
  git-config-dev:
  ssh-keys-dev:
  gh-config-dev:
  glab-config-dev:
