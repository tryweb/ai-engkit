# V2 Production Compose — isolated from V1 (prod/dev) and the V2 dev stack.
# Coexists on one host:
#   V1 prod 8000/8080 · V1 dev 8001/8081 · V2 prod 8002/8082 · V2 dev 8003/8083.
# Rationale: opencode #42260 — the V2 binary migrates the shared opencode.db in
# place and breaks V1, so every V2 volume is `-v2` suffixed and never shared
# with V1 prod/dev or the V2 dev stack (`-v2dev`).
# Pulable V2 channel: `:v2` (override with AI_ENGKIT_VERSION). Published by
# ci.yml's push-v2 job; the V2 dev stack builds the image locally instead.
# The ai-admin service keeps the host bind mounts the Admin UI upgrade path
# writes (compose, .env, admin-data, backups) — unlike the V2 dev stack, which
# runs entirely from volumes.
# See docs/knowledge/tooling/opencode-v2-migration-watch.md
name: v2

services:
  ai-dev:
    image: ghcr.io/tryweb/ai-engkit:${AI_ENGKIT_VERSION:-v2}
    container_name: ai-engkit-v2
    ports:
      - "${CHAMBER_V2_PORT:-8002}:3000"
    volumes:
      - workspace-v2:/home/devuser/workspace
      - opencode-data-v2:/home/devuser/.local/share/opencode
      - lean-ctx-data-v2:/home/devuser/.local/share/lean-ctx
      - lean-ctx-state-v2:/home/devuser/.local/state/lean-ctx
      - lean-ctx-config-v2:/home/devuser/.config/lean-ctx
      - opencode-config-v2:/home/devuser/.config/opencode
      - opencode-cache-v2:/home/devuser/.cache/opencode
      - openchamber-data-v2:/home/devuser/.config/openchamber
      - git-config-v2:/home/devuser/.config/git
      - ssh-keys-v2:/home/devuser/.ssh
      - gh-config-v2:/home/devuser/.config/gh
      - glab-config-v2:/home/devuser/.config/glab-cli
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env.v2
        required: false
    environment:
      OPENCHAMBER_HOST: ${OPENCHAMBER_HOST:-0.0.0.0}
      # V2 line carries no OMO runtime (D1).
      OMO_ENABLED: 0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ai-admin:
    image: ghcr.io/tryweb/ai-engkit:${AI_ENGKIT_VERSION:-v2}
    container_name: ai-engkit-admin-v2
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    working_dir: /opt/admin
    command: ["bun", "run", "/opt/admin/server.ts"]
    ports:
      - "${ADMIN_V2_PORT:-8082}:8080"
    volumes:
      - ./.env.v2:/opt/ai-engkit/.env:rw
      - ./docker-compose.v2.yml:/opt/ai-engkit/compose.yml:rw
      - ./admin-data-v2:/opt/ai-engkit/admin-data:rw
      - ./admin-data-v2/upgrade-base.yml:/opt/ai-engkit/compose-upgrade-base.yml:rw
      - ./extensions:/opt/ai-engkit/extensions:ro
      - ./backups-v2:/opt/ai-engkit/backups:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ADMIN_PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Same no-OMO gate as ai-dev: without this, Admin TS takes V1 (omo.jsonc)
      # paths even on the V2 line.
      - OMO_ENABLED=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  workspace-v2:
  opencode-data-v2:
  lean-ctx-data-v2:
  lean-ctx-state-v2:
  lean-ctx-config-v2:
  opencode-config-v2:
  opencode-cache-v2:
  openchamber-data-v2:
  git-config-v2:
  ssh-keys-v2:
  gh-config-v2:
  glab-config-v2:
