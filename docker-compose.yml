services:
  ai-dev:
    image: ghcr.io/tryweb/ai-engkit:${AI_ENGKIT_VERSION:-latest}
    container_name: ai-engkit
    ports:
      - "${CHAMBER_PORT:-8000}:3000"
    volumes:
      - ${WORKSPACE_PATH:-workspace}:/home/devuser/workspace
      - opencode-data:/home/devuser/.local/share/opencode
      - lean-ctx-data:/home/devuser/.local/share/lean-ctx
      - lean-ctx-state:/home/devuser/.local/state/lean-ctx
      - lean-ctx-config:/home/devuser/.config/lean-ctx
      - opencode-config:/home/devuser/.config/opencode
      - omo-config:/home/devuser/.omo
      - opencode-cache:/home/devuser/.cache/opencode
      - ohmyopencode-cache:/home/devuser/.cache/oh-my-opencode
      - openchamber-data:/home/devuser/.config/openchamber
      - git-config:/home/devuser/.config/git
      - ssh-keys:/home/devuser/.ssh
      - gh-config:/home/devuser/.config/gh
      - glab-config:/home/devuser/.config/glab-cli
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    environment:
      OPENCHAMBER_HOST: ${OPENCHAMBER_HOST:-0.0.0.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ai-admin:
    image: ghcr.io/tryweb/ai-engkit:${AI_ENGKIT_VERSION:-latest}
    container_name: ai-engkit-admin
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    working_dir: /opt/admin
    command: ["bun", "run", "/opt/admin/server.ts"]
    ports:
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    volumes:
      - ./.env:/opt/ai-engkit/.env:rw
      - ./docker-compose.yml:/opt/ai-engkit/compose.yml:rw
      - ./admin-data:/opt/ai-engkit/admin-data:rw
      - ./admin-data/upgrade-base.yml:/opt/ai-engkit/compose-upgrade-base.yml:rw
      - ./extensions:/opt/ai-engkit/extensions:ro
      - ./backups:/opt/ai-engkit/backups:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ADMIN_PORT=${ADMIN_PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ADMIN_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  workspace:
  opencode-data:
  lean-ctx-data:
  lean-ctx-state:
  lean-ctx-config:
  opencode-config:
  omo-config:
  opencode-cache:
  ohmyopencode-cache:
  openchamber-data:
  git-config:
  ssh-keys:
  gh-config:
  glab-config:
