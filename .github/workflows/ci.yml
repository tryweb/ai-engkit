name: CI

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# Supersede stale runs: rapid successive pushes cancel the queued one
# instead of running every full pipeline back-to-back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # NOTE: `on:` cannot read the `vars` context, so the v2 branch is listed
    # literally here while every `if:` gate uses vars.V2_BRANCH (the single
    # source of truth). Renaming the v2 branch therefore requires updating BOTH
    # this line AND the V2_BRANCH repository variable — see
    # docs/knowledge/tooling/v2-branch-wiring.md.
    branches: [main, trial/opencode-v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags: ['v1.*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'PR head SHA to test (for bot-created PRs that bypass the pull_request trigger)'
        required: false
        type: string
        default: ''

jobs:
  config-guard:
    name: CI config guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # V2 gating reads vars.V2_BRANCH; an unset variable would silently
      # disable build-v2/trial-v2/scan-v2/push-v2-trial. Fail loudly instead.
      - name: Require the V2_BRANCH repository variable
        run: |
          if [ -z "${{ vars.V2_BRANCH }}" ]; then
            echo "::error::Repository variable V2_BRANCH is not set. V2 CI gating (build-v2/trial-v2/scan-v2/push-v2-trial) reads it, and an empty value disables the whole V2 pipeline. Set it under Settings -> Secrets and variables -> Actions -> Variables to the v2 branch name (e.g. trial/opencode-v2)."
            exit 1
          fi
          echo "V2_BRANCH=${{ vars.V2_BRANCH }}"

  build:
    name: Build Image
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v1.') ||
      (github.event_name == 'pull_request' && github.head_ref != vars.V2_BRANCH) ||
      (github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', vars.V2_BRANCH))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.ref }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building image with version: ${VERSION}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=docker,dest=/tmp/image.tar
          tags: ai-engkit:ci
          build-args: AI_ENGKIT_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load built image
        run: docker load -i /tmp/image.tar

      - name: Create .env for Compose validation
        run: cp .env.example .env

      - name: Install Compose guard dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compose isolation guard
        run: bash test/test-compose-isolation.sh

      - name: Version-pin checker regression
        run: bash test/test-check-versions.sh

      - name: Admin unit tests
        run: docker run --rm ai-engkit:ci bun --cwd /opt/admin test

      - name: Admin typecheck
        run: docker run --rm ai-engkit:ci bun run --cwd /opt/admin typecheck

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 7

  build-v2:
    name: Build V2 Image
    if: |
      github.ref == format('refs/heads/{0}', vars.V2_BRANCH) ||
      (github.event_name == 'pull_request' && github.head_ref == vars.V2_BRANCH) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', vars.V2_BRANCH))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env for Compose
        run: cp .env.example .env

      - name: Install Compose guard dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compose isolation guard
        run: bash test/test-compose-isolation.sh

      - name: Version-pin checker regression
        run: bash test/test-check-versions.sh

      # Pins come from docker-compose.v2.yml (single source of truth for the
      # V2 line: OpenCode 2 CLI package/version, OpenChamber 2.x, no OMO).
      - name: Build V2 image
        run: docker compose -f docker-compose.v2.yml build ai-dev

      - name: V2 image smoke (CLI + baked plugins)
        run: |
          set -euo pipefail
          OPENCODE_VERSION=$(docker run --rm --entrypoint /home/devuser/.bun/bin/opencode ai-engkit-ai-v2 --version)
          echo "OpenCode CLI version: ${OPENCODE_VERSION}"
          printf '%s\n' "$OPENCODE_VERSION" | grep -Eq '(^|[[:space:]])v?2\.[0-9]+\.[0-9]+([[:space:]]|$)'
          docker run --rm --entrypoint /usr/bin/test ai-engkit-ai-v2 -f /opt/opencode/v2-plugins/b1-routing.js
          docker run --rm --entrypoint /usr/bin/test ai-engkit-ai-v2 -f /opt/opencode/v2-plugins/m3-enforcer.js
          echo "PASS: V2 image builds with baked routing/enforcer plugins"

      - name: V2 Admin unit tests
        run: docker run --rm --entrypoint /home/devuser/.bun/bin/bun ai-engkit-ai-v2 --cwd /opt/admin test

      - name: V2 Admin typecheck
        run: docker run --rm --entrypoint /home/devuser/.bun/bin/bun ai-engkit-ai-v2 run --cwd /opt/admin typecheck

      - name: Save V2 image artifact
        run: docker save ai-engkit-ai-v2 -o /tmp/image-v2.tar

      - name: Upload V2 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-v2
          path: /tmp/image-v2.tar
          retention-days: 7

  trial-v2:
    name: V2 Integration Tests
    needs: build-v2
    if: github.event_name != 'pull_request' && needs.build-v2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      - name: Create .env for Compose
        run: cp .env.example .env

      - name: Configure V2 trial diagnostics
        run: |
          printf '\nBREW_PACKAGES="go"\nBUN_PACKAGES="pyright @biomejs/biome typescript@5.8.3"\n' >> .env

      - name: Start V2 integration stack
        run: docker compose -f docker-compose.v2.yml up --no-build -d

      - name: Wait for V2 services
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 5 -o /dev/null "http://localhost:8002/" && \
               curl -sf -m 5 -o /dev/null "http://localhost:8082/healthz"; then
              echo "V2 OpenChamber and Admin ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::V2 OpenChamber or Admin did not become ready"
          docker compose -f docker-compose.v2.yml logs --tail=50 || true
          exit 1

      - name: V2 runtime and diagnostics cells
        run: |
          bash test/test-v2-trial.sh cell1
          bash test/test-v2-trial.sh cell2
          bash test/test-v2-trial.sh cell3

      - name: V2 Admin HTTP integration smoke
        env:
          ADMIN_PASSWORD: testadmin123
        run: bash test/test-v2-admin-integration.sh

      - name: V2 Admin integration unit tests
        run: docker exec -e OMO_ENABLED=1 ai-engkit-admin-v2 bun --cwd /opt/admin test --parallel=4

      - name: V2 Admin integration typecheck
        run: docker exec ai-engkit-admin-v2 bun run --cwd /opt/admin typecheck

      - name: V2 integration logs
        if: always()
        run: docker compose -f docker-compose.v2.yml logs --tail=80 || true

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.v2.yml down -v --remove-orphans || true

  scan-v2:
    name: V2 Vulnerability Scan
    needs: build-v2
    if: github.event_name != 'pull_request' && needs.build-v2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      - name: Pull V2 baseline image
        id: baseline
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          if docker pull "${IMAGE}:v2-trial" >/dev/null 2>&1; then
            BASELINE_IMAGE="${IMAGE}:v2-trial"
          else
            # Bootstrap the first V2 scan against the current V1 stable image;
            # subsequent trial builds compare against the previous V2 image.
            BASELINE_IMAGE="${IMAGE}:latest"
            docker pull "${BASELINE_IMAGE}"
          fi
          echo "image=${BASELINE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Scan V2 baseline image
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.baseline.outputs.image }}
          output-format: json
          output-file: grype-v2-baseline-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Scan V2 candidate image for release gate
        uses: anchore/scan-action@v7
        with:
          image: ai-engkit-ai-v2
          output-format: json
          output-file: grype-v2-candidate-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Run Grype scan for V2 Security tab
        uses: anchore/scan-action@v7
        with:
          image: ai-engkit-ai-v2
          output-format: sarif
          output-file: grype-v2-results.sarif
          severity-cutoff: critical
          fail-build: false

      - name: Gate V2 scan against baseline
        run: bash .github/scripts/grype-release-check.sh grype-v2-candidate-results.json grype-v2-baseline-results.json

      - name: Upload V2 Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-v2-results.sarif
          category: sca-grype-v2

  push-v2-trial:
    name: Push V2 Trial Image to GHCR
    needs: [trial-v2, scan-v2]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', vars.V2_BRANCH)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push V2 trial image
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          docker tag ai-engkit-ai-v2 "${IMAGE}:v2-trial"
          docker tag ai-engkit-ai-v2 "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:v2-trial"
          docker push "${IMAGE}:sha-${{ github.sha }}"

  test:
    name: Integration Tests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=testadmin123/' .env

      - name: Start services
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            ai-dev:
              image: ai-engkit:ci
              container_name: ci-test
              volumes:
                - workspace-dev:/home/devuser/workspace
                - opencode-data-dev:/home/devuser/.local/share/opencode
                - opencode-config-dev:/home/devuser/.config/opencode
                - openchamber-data-dev:/home/devuser/.config/openchamber
                - ssh-keys-dev:/home/devuser/.ssh
                - git-config-dev:/home/devuser/.config/git
                - /var/run/docker.sock:/var/run/docker.sock
            ai-admin:
              image: ai-engkit:ci
          EOF
          docker compose -p dev -f docker-compose.dev.yml -f docker-compose.override.yml up -d
          echo "Waiting for services..."
          sleep 60

      - name: Run tests
        env:
          ADMIN_PORT: 8081
        run: |
          chmod +x test/run-tests.sh

          # === 1. Main dev container — basic functionality ===
          ./test/run-tests.sh ci-test

          # === 1.1 Docker socket GID conflict handling ===
          bash ./test/test-docker-gid.sh ai-engkit:ci

          # === 1.2 OpenChamber defaultModel seed/backfill (unit) ===
          bash ./test/test-openchamber-settings-seed.sh
          bash ./test/test-omo-config-normalization.sh
          bash ./test/test-native-agent-overrides.sh

          # === 1.3 Release vulnerability gate contracts ===
          bash ./test/test-grype-release-check.sh
          bash ./test/test-release-body.sh
          bash ./test/test-release-gate-e2e.sh

          # === 2. Admin container — dashboard integration ===
          ./test/test-admin.sh ai-engkit-admin-dev

          # === 3. Admin UI — smoke tests ===
          ADMIN_BASE_URL="http://localhost:8081" ./test/test-admin-ui.sh

      - name: Admin unit tests (integration)
        run: docker exec ci-test bun --cwd /opt/admin test

      - name: Admin typecheck (integration)
        run: docker exec ci-test bun run --cwd /opt/admin typecheck

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -p dev -f docker-compose.dev.yml logs ai-dev ai-admin || true
          docker compose -p dev -f docker-compose.dev.yml ps || true

      - name: Cleanup
        if: always()
        run: docker compose -p dev -f docker-compose.dev.yml down -v --remove-orphans || true

  scan:
    name: Vulnerability Scan
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    outputs:
      critical-count: ${{ steps.summary.outputs.critical-count }}
      high-count: ${{ steps.summary.outputs.high-count }}
      medium-count: ${{ steps.summary.outputs.medium-count }}
      low-count: ${{ steps.summary.outputs.low-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Pull published baseline image
        run: docker pull "${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}:latest"

      - name: Scan published baseline image
        uses: anchore/scan-action@v7
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository }}:latest"
          output-format: json
          output-file: grype-baseline-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Scan candidate image for release gate
        uses: anchore/scan-action@v7
        with:
          image: "ai-engkit:ci"
          output-format: json
          output-file: grype-candidate-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Run Grype vulnerability scan for Security tab
        uses: anchore/scan-action@v7
        with:
          image: "ai-engkit:ci"
          output-format: sarif
          output-file: grype-results.sarif
          severity-cutoff: critical
          fail-build: false

      - name: Summarize and gate scan results
        id: summary
        run: bash .github/scripts/grype-release-check.sh grype-candidate-results.json grype-baseline-results.json

      - name: Upload Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: sca-grype

  push:
    name: Push to GHCR
    needs: [build, scan]
    if: startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Inject version into image
        run: |
          VERSION="${{ github.ref_name }}"
          printf '%s' "${VERSION}" > /tmp/ai-engkit-version
          docker create --name tmp ai-engkit:ci
          docker cp /tmp/ai-engkit-version tmp:/opt/ai-engkit/VERSION
          docker commit tmp ai-engkit:ci > /dev/null
          docker rm -f tmp > /dev/null
          echo "::notice::Injected version: ${VERSION}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          docker tag ai-engkit:ci "${IMAGE}:${{ github.ref_name }}"
          docker tag ai-engkit:ci "${IMAGE}:sha-${{ github.sha }}"
          docker push --all-tags "${IMAGE}"

  release:
    name: Create Release
    needs: [push, test, scan]
    if: startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Body
        id: body
        env:
          HIGH_COUNT: ${{ needs.scan.outputs.high-count }}
          MEDIUM_COUNT: ${{ needs.scan.outputs.medium-count }}
          LOW_COUNT: ${{ needs.scan.outputs.low-count }}
        run: |
          bash .github/scripts/release-body.sh \
            "${{ github.ref_name }}" \
            "Generated by GitHub Actions" \
            "${{ needs.scan.outputs.critical-count }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.body.outputs.body }}

  auto-tag:
    name: Auto Tag Dependency Updates
    needs: [test, scan]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.message, 'chore: update Dockerfile pinned versions') ||
       contains(github.event.head_commit.message, 'chore: dependency update release') ||
       contains(github.event.head_commit.message, 'dependency version update'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same guard as dependency-update.yml's scheduled auto-release path:
      # auto-tagging main tip would bundle unreleased human commits
      # (feat/fix/style/ci/...) into a dependency-only patch release.
      - name: Check unreleased commits
        id: gate
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE '(rc|beta|alpha|dev|test|pre)' | head -1 || true)

          if [[ -z "$LAST_TAG" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stable release tag found; auto-tag blocked pending a manual release"
            exit 0
          fi

          SIGNIFICANT_LIST=$(git log "${LAST_TAG}..HEAD" --no-merges --format='%h %s' \
            | grep -vE '^[0-9a-f]+ (chore|docs)(\(|:)' || true)

          if [[ -z "$SIGNIFICANT_LIST" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No significant unreleased commits since ${LAST_TAG}"
          else
            COUNT=$(printf '%s\n' "$SIGNIFICANT_LIST" | wc -l | tr -d ' ')
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$COUNT significant unreleased commit(s) since ${LAST_TAG}; auto-tag skipped - cut a manual release instead"
          fi

      - name: Calculate PATCH version
        if: steps.gate.outputs.allowed == 'true'
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --sort=-version:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            grep -vE '(rc|beta|alpha|dev|test|pre)' | \
            head -1 || echo "v0.0.0")
          CHANGELOG_VERSION=""
          if [[ -f docs/CHANGELOG.md ]]; then
            CHANGELOG_VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\] - )' docs/CHANGELOG.md || true)
          fi
          echo "latest-tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          NEXT_PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | awk -F. '{$NF = $NF + 1;} 1' OFS='.')
          NEXT_VERSION="v${NEXT_PATCH}"
          if [[ -n "$CHANGELOG_VERSION" ]]; then
            CHANGELOG_TAG="v${CHANGELOG_VERSION}"
            HIGHER_VERSION=$(printf '%s\n%s\n' "$LATEST_TAG" "$CHANGELOG_TAG" | sort -V | tail -n1)
            if [[ "$HIGHER_VERSION" == "$CHANGELOG_TAG" && "$CHANGELOG_TAG" != "$LATEST_TAG" ]]; then
              NEXT_VERSION="$CHANGELOG_TAG"
            fi
          fi
          echo "next-version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Version bump: $LATEST_TAG -> ${NEXT_VERSION}"

      - name: Create and push tag
        if: steps.gate.outputs.allowed == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          NEXT_VERSION="${{ steps.version.outputs.next-version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_VERSION" -m "Release $NEXT_VERSION — dependency updates"
          git push origin "$NEXT_VERSION"
          echo "::notice::Created and pushed tag: $NEXT_VERSION"

      - name: Download image artifact
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        if: steps.gate.outputs.allowed == 'true'
        run: docker load -i /tmp/image.tar

      - name: Inject version into image
        if: steps.gate.outputs.allowed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.next-version }}"
          printf '%s' "${VERSION}" > /tmp/ai-engkit-version
          docker create --name tmp ai-engkit:ci
          docker cp /tmp/ai-engkit-version tmp:/opt/ai-engkit/VERSION
          docker commit tmp ai-engkit:ci > /dev/null
          docker rm -f tmp > /dev/null
          echo "::notice::Injected version: ${VERSION}"

      - name: Login to GHCR
        if: steps.gate.outputs.allowed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: steps.gate.outputs.allowed == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          NEXT_VERSION="${{ steps.version.outputs.next-version }}"
          docker tag ai-engkit:ci "${IMAGE}:${NEXT_VERSION}"
          docker tag ai-engkit:ci "${IMAGE}:sha-${{ github.sha }}"
          docker push --all-tags "${IMAGE}"
          echo "::notice::Pushed image: ${IMAGE}:${NEXT_VERSION}"

      - name: Generate Release Body
        if: steps.gate.outputs.allowed == 'true'
        id: body
        env:
          HIGH_COUNT: ${{ needs.scan.outputs.high-count }}
          MEDIUM_COUNT: ${{ needs.scan.outputs.medium-count }}
          LOW_COUNT: ${{ needs.scan.outputs.low-count }}
        run: |
          bash .github/scripts/release-body.sh \
            "${{ steps.version.outputs.next-version }}" \
            "Generated by GitHub Actions — auto-release on dependency update" \
            "${{ needs.scan.outputs.critical-count }}"

      - name: Create Release
        if: steps.gate.outputs.allowed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.next-version }}
          body: ${{ steps.body.outputs.body }}
