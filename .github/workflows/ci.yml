name: CI

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# Supersede stale runs: rapid successive pushes cancel the queued one
# instead of running every full pipeline back-to-back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'PR head SHA to test (for bot-created PRs that bypass the pull_request trigger)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.ref }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building image with version: ${VERSION}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=docker,dest=/tmp/image.tar
          tags: ai-engkit:ci
          build-args: AI_ENGKIT_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load built image
        run: docker load -i /tmp/image.tar

      - name: Create .env for Compose validation
        run: cp .env.example .env

      - name: Install Compose guard dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compose isolation guard
        run: bash test/test-compose-isolation.sh

      - name: LSP MCP config tests
        run: bash test/test-lsp-mcp-config.sh

      - name: Admin unit tests
        run: docker run --rm ai-engkit:ci bun --cwd /opt/admin test

      - name: Admin typecheck
        run: docker run --rm ai-engkit:ci bun run --cwd /opt/admin typecheck

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 7

  test:
    name: Integration Tests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=testadmin123/' .env

      - name: Start services
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            ai-dev:
              image: ai-engkit:ci
              container_name: ci-test
              volumes:
                - workspace-dev:/home/devuser/workspace
                - opencode-data-dev:/home/devuser/.local/share/opencode
                - opencode-config-dev:/home/devuser/.config/opencode
                - openchamber-data-dev:/home/devuser/.config/openchamber
                - ssh-keys-dev:/home/devuser/.ssh
                - git-config-dev:/home/devuser/.config/git
                - /var/run/docker.sock:/var/run/docker.sock
            ai-admin:
              image: ai-engkit:ci
          EOF
          docker compose -p dev -f docker-compose.dev.yml -f docker-compose.override.yml up -d
          echo "Waiting for services..."
          sleep 60

      - name: Run tests
        env:
          ADMIN_PORT: 8081
        run: |
          chmod +x test/run-tests.sh

          # === 1. Main dev container — basic functionality ===
          ./test/run-tests.sh ci-test

          # === 1.1 Docker socket GID conflict handling ===
          bash ./test/test-docker-gid.sh ai-engkit:ci

          # === 1.2 OpenChamber defaultModel seed/backfill (unit) ===
          bash ./test/test-openchamber-settings-seed.sh
          bash ./test/test-omo-config-normalization.sh
          bash ./test/test-native-agent-overrides.sh

          # === 1.3 Release vulnerability gate contracts ===
          bash ./test/test-grype-release-check.sh
          bash ./test/test-release-body.sh
          bash ./test/test-release-gate-e2e.sh

          # === 2. Admin container — dashboard integration ===
          ./test/test-admin.sh ai-engkit-admin-dev

          # === 3. Admin UI — smoke tests ===
          ADMIN_BASE_URL="http://localhost:8081" ./test/test-admin-ui.sh

      - name: Admin unit tests (integration)
        run: docker exec ci-test bun --cwd /opt/admin test

      - name: Admin typecheck (integration)
        run: docker exec ci-test bun run --cwd /opt/admin typecheck

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -p dev -f docker-compose.dev.yml logs ai-dev ai-admin || true
          docker compose -p dev -f docker-compose.dev.yml ps || true

      - name: Cleanup
        if: always()
        run: docker compose -p dev -f docker-compose.dev.yml down -v --remove-orphans || true

  scan:
    name: Vulnerability Scan
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    outputs:
      critical-count: ${{ steps.summary.outputs.critical-count }}
      high-count: ${{ steps.summary.outputs.high-count }}
      medium-count: ${{ steps.summary.outputs.medium-count }}
      low-count: ${{ steps.summary.outputs.low-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Pull published baseline image
        run: docker pull "${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}:latest"

      - name: Scan published baseline image
        uses: anchore/scan-action@v7
        with:
          image: "${{ env.REGISTRY }}/${{ github.repository }}:latest"
          output-format: json
          output-file: grype-baseline-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Scan candidate image for release gate
        uses: anchore/scan-action@v7
        with:
          image: "ai-engkit:ci"
          output-format: json
          output-file: grype-candidate-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Run Grype vulnerability scan for Security tab
        uses: anchore/scan-action@v7
        with:
          image: "ai-engkit:ci"
          output-format: sarif
          output-file: grype-results.sarif
          severity-cutoff: critical
          fail-build: false

      - name: Summarize and gate scan results
        id: summary
        run: bash .github/scripts/grype-release-check.sh grype-candidate-results.json grype-baseline-results.json

      - name: Upload Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: sca-grype

  push:
    name: Push to GHCR
    needs: [build, scan]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Inject version into image
        run: |
          VERSION="${{ github.ref_name }}"
          printf '%s' "${VERSION}" > /tmp/ai-engkit-version
          docker create --name tmp ai-engkit:ci
          docker cp /tmp/ai-engkit-version tmp:/opt/ai-engkit/VERSION
          docker commit tmp ai-engkit:ci > /dev/null
          docker rm -f tmp > /dev/null
          echo "::notice::Injected version: ${VERSION}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          docker tag ai-engkit:ci "${IMAGE}:${{ github.ref_name }}"
          docker tag ai-engkit:ci "${IMAGE}:sha-${{ github.sha }}"
          docker push --all-tags "${IMAGE}"

  release:
    name: Create Release
    needs: [push, test, scan]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Body
        id: body
        env:
          HIGH_COUNT: ${{ needs.scan.outputs.high-count }}
          MEDIUM_COUNT: ${{ needs.scan.outputs.medium-count }}
          LOW_COUNT: ${{ needs.scan.outputs.low-count }}
        run: |
          bash .github/scripts/release-body.sh \
            "${{ github.ref_name }}" \
            "Generated by GitHub Actions" \
            "${{ needs.scan.outputs.critical-count }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.body.outputs.body }}

  auto-tag:
    name: Auto Tag Dependency Updates
    needs: [test, scan]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.message, 'chore: update Dockerfile pinned versions') ||
       contains(github.event.head_commit.message, 'chore: dependency update release') ||
       contains(github.event.head_commit.message, 'dependency version update'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same guard as dependency-update.yml's scheduled auto-release path:
      # auto-tagging main tip would bundle unreleased human commits
      # (feat/fix/style/ci/...) into a dependency-only patch release.
      - name: Check unreleased commits
        id: gate
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE '(rc|beta|alpha|dev|test|pre)' | head -1 || true)

          if [[ -z "$LAST_TAG" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stable release tag found; auto-tag blocked pending a manual release"
            exit 0
          fi

          SIGNIFICANT_LIST=$(git log "${LAST_TAG}..HEAD" --no-merges --format='%h %s' \
            | grep -vE '^[0-9a-f]+ (chore|docs)(\(|:)' || true)

          if [[ -z "$SIGNIFICANT_LIST" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No significant unreleased commits since ${LAST_TAG}"
          else
            COUNT=$(printf '%s\n' "$SIGNIFICANT_LIST" | wc -l | tr -d ' ')
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$COUNT significant unreleased commit(s) since ${LAST_TAG}; auto-tag skipped - cut a manual release instead"
          fi

      - name: Calculate PATCH version
        if: steps.gate.outputs.allowed == 'true'
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --sort=-version:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            grep -vE '(rc|beta|alpha|dev|test|pre)' | \
            head -1 || echo "v0.0.0")
          CHANGELOG_VERSION=""
          if [[ -f docs/CHANGELOG.md ]]; then
            CHANGELOG_VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\] - )' docs/CHANGELOG.md || true)
          fi
          echo "latest-tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          NEXT_PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | awk -F. '{$NF = $NF + 1;} 1' OFS='.')
          NEXT_VERSION="v${NEXT_PATCH}"
          if [[ -n "$CHANGELOG_VERSION" ]]; then
            CHANGELOG_TAG="v${CHANGELOG_VERSION}"
            HIGHER_VERSION=$(printf '%s\n%s\n' "$LATEST_TAG" "$CHANGELOG_TAG" | sort -V | tail -n1)
            if [[ "$HIGHER_VERSION" == "$CHANGELOG_TAG" && "$CHANGELOG_TAG" != "$LATEST_TAG" ]]; then
              NEXT_VERSION="$CHANGELOG_TAG"
            fi
          fi
          echo "next-version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Version bump: $LATEST_TAG -> ${NEXT_VERSION}"

      - name: Create and push tag
        if: steps.gate.outputs.allowed == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          NEXT_VERSION="${{ steps.version.outputs.next-version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_VERSION" -m "Release $NEXT_VERSION — dependency updates"
          git push origin "$NEXT_VERSION"
          echo "::notice::Created and pushed tag: $NEXT_VERSION"

      - name: Download image artifact
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        if: steps.gate.outputs.allowed == 'true'
        run: docker load -i /tmp/image.tar

      - name: Inject version into image
        if: steps.gate.outputs.allowed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.next-version }}"
          printf '%s' "${VERSION}" > /tmp/ai-engkit-version
          docker create --name tmp ai-engkit:ci
          docker cp /tmp/ai-engkit-version tmp:/opt/ai-engkit/VERSION
          docker commit tmp ai-engkit:ci > /dev/null
          docker rm -f tmp > /dev/null
          echo "::notice::Injected version: ${VERSION}"

      - name: Login to GHCR
        if: steps.gate.outputs.allowed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: steps.gate.outputs.allowed == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          NEXT_VERSION="${{ steps.version.outputs.next-version }}"
          docker tag ai-engkit:ci "${IMAGE}:${NEXT_VERSION}"
          docker tag ai-engkit:ci "${IMAGE}:sha-${{ github.sha }}"
          docker push --all-tags "${IMAGE}"
          echo "::notice::Pushed image: ${IMAGE}:${NEXT_VERSION}"

      - name: Generate Release Body
        if: steps.gate.outputs.allowed == 'true'
        id: body
        env:
          HIGH_COUNT: ${{ needs.scan.outputs.high-count }}
          MEDIUM_COUNT: ${{ needs.scan.outputs.medium-count }}
          LOW_COUNT: ${{ needs.scan.outputs.low-count }}
        run: |
          bash .github/scripts/release-body.sh \
            "${{ steps.version.outputs.next-version }}" \
            "Generated by GitHub Actions — auto-release on dependency update" \
            "${{ needs.scan.outputs.critical-count }}"

      - name: Create Release
        if: steps.gate.outputs.allowed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.next-version }}
          body: ${{ steps.body.outputs.body }}
