name: CI

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# Supersede stale runs: rapid successive pushes cancel the queued one
# instead of running every full pipeline back-to-back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # NOTE: `on:` cannot read the `vars` context, so the v2 branch is listed
    # literally here while every `if:` gate uses vars.V2_BRANCH (the single
    # source of truth). Renaming the v2 branch therefore requires updating BOTH
    # this line AND the V2_BRANCH repository variable — see
    # docs/knowledge/tooling/v2-branch-wiring.md.
    branches: [v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags: ['v2.*']
  pull_request:
    branches: [v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'PR head SHA to test (for bot-created PRs that bypass the pull_request trigger)'
        required: false
        type: string
        default: ''

jobs:
  config-guard:
    name: CI config guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # V2 gating reads vars.V2_BRANCH; an unset variable would silently
      # disable build-v2/test-v2/scan-v2/push-v2. Fail loudly instead.
      - name: Require the V2_BRANCH repository variable
        run: |
          if [ -z "${{ vars.V2_BRANCH }}" ]; then
            echo "::error::Repository variable V2_BRANCH is not set. V2 CI gating (build-v2/test-v2/scan-v2/push-v2) reads it, and an empty value disables the whole V2 pipeline. Set it under Settings -> Secrets and variables -> Actions -> Variables to the v2 branch name (e.g. v2)."
            exit 1
          fi
          echo "V2_BRANCH=${{ vars.V2_BRANCH }}"

  build-v2:
    name: Build V2 Image
    if: |
      github.ref == format('refs/heads/{0}', vars.V2_BRANCH) ||
      startsWith(github.ref, 'refs/tags/v2.') ||
      (github.event_name == 'pull_request' && github.head_ref == vars.V2_BRANCH) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', vars.V2_BRANCH))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env for Compose
        run: cp .env.v2.example .env

      - name: Install Compose guard dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compose isolation guard
        run: bash test/test-compose-isolation.sh

      - name: Version-pin checker regression
        run: bash test/test-check-versions.sh

      # Pins come from docker-compose.v2.dev.yml (single source of truth for the
      # V2 line: OpenCode 2 CLI package/version, OpenChamber 2.x, no OMO).
      - name: Build V2 image
        run: docker compose -f docker-compose.v2.dev.yml build ai-dev

      - name: V2 image smoke (CLI + baked plugins)
        run: |
          set -euo pipefail
          OPENCODE_VERSION=$(docker run --rm --entrypoint /home/devuser/.bun/bin/opencode ai-engkit-ai-v2dev --version)
          echo "OpenCode CLI version: ${OPENCODE_VERSION}"
          printf '%s\n' "$OPENCODE_VERSION" | grep -Eq '(^|[[:space:]])v?2\.[0-9]+\.[0-9]+([[:space:]]|$)'
          docker run --rm --entrypoint /usr/bin/test ai-engkit-ai-v2dev -f /opt/opencode/v2-plugins/b1-routing.js
          docker run --rm --entrypoint /usr/bin/test ai-engkit-ai-v2dev -f /opt/opencode/v2-plugins/m3-enforcer.js
          echo "PASS: V2 image builds with baked routing/enforcer plugins"

      - name: V2 Admin unit tests
        run: docker run --rm --entrypoint /home/devuser/.bun/bin/bun ai-engkit-ai-v2dev --cwd /opt/admin test

      - name: V2 Admin typecheck
        run: docker run --rm --entrypoint /home/devuser/.bun/bin/bun ai-engkit-ai-v2dev run --cwd /opt/admin typecheck

      - name: OpenChamber update guard regression (V2)
        run: docker run --rm --pull never -v "$PWD:/repo" -w /repo --entrypoint /bin/bash ai-engkit-ai-v2dev test/test-openchamber-update-guard.sh

      - name: Save V2 image artifact
        run: docker save ai-engkit-ai-v2dev -o /tmp/image-v2.tar

      - name: Upload V2 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-v2
          path: /tmp/image-v2.tar
          retention-days: 7

  test-v2:
    name: V2 Integration Tests
    needs: build-v2
    if: github.event_name != 'pull_request' && needs.build-v2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      - name: Create .env for Compose
        run: cp .env.v2.example .env
        # NOTE: V2 diagnostics packages (BREW/BUN_PACKAGES) now default in
        # .env.v2.example itself (single source); no per-CI append needed.

      - name: Start V2 integration stack
        run: docker compose -f docker-compose.v2.dev.yml up --no-build -d

      - name: Wait for V2 services
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 5 -o /dev/null "http://localhost:8003/" && \
               curl -sf -m 5 -o /dev/null "http://localhost:8083/healthz"; then
              echo "V2 OpenChamber and Admin ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::V2 OpenChamber or Admin did not become ready"
          docker compose -f docker-compose.v2.dev.yml logs --tail=50 || true
          exit 1

      - name: V2 runtime and diagnostics cells
        run: |
          bash test/test-v2.sh cell1
          bash test/test-v2.sh cell2
          bash test/test-v2.sh cell3

      - name: V2 Admin HTTP integration smoke
        env:
          ADMIN_PASSWORD: testadmin123
        run: bash test/test-v2-admin-integration.sh

      - name: V2 Admin integration unit tests
        run: docker exec -e OMO_ENABLED=1 ai-engkit-admin-v2dev bun --cwd /opt/admin test --parallel=4

      - name: V2 Admin integration typecheck
        run: docker exec ai-engkit-admin-v2dev bun run --cwd /opt/admin typecheck

      - name: V2 integration logs
        if: always()
        run: docker compose -f docker-compose.v2.dev.yml logs --tail=80 || true

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.v2.dev.yml down -v --remove-orphans || true

  scan-v2:
    name: V2 Vulnerability Scan
    needs: build-v2
    if: github.event_name != 'pull_request' && needs.build-v2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    outputs:
      critical-count: ${{ steps.gate.outputs.critical-count }}
      high-count: ${{ steps.gate.outputs.high-count }}
      medium-count: ${{ steps.gate.outputs.medium-count }}
      low-count: ${{ steps.gate.outputs.low-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      - name: Pull V2 baseline image
        id: baseline
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          # V1 and V2 are independent release lines with independent images:
          # the gate only ever compares against the previous V2 image. A
          # missing :v2 tag means promotion is broken — fail loudly instead
          # of silently gating against another line's image.
          docker pull "${IMAGE}:v2"
          echo "image=${IMAGE}:v2" >> "$GITHUB_OUTPUT"

      - name: Scan V2 baseline image
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.baseline.outputs.image }}
          output-format: json
          output-file: grype-v2-baseline-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Scan V2 candidate image for release gate
        uses: anchore/scan-action@v7
        with:
          image: ai-engkit-ai-v2dev
          output-format: json
          output-file: grype-v2-candidate-results.json
          severity-cutoff: negligible
          fail-build: false

      - name: Run Grype scan for V2 Security tab
        uses: anchore/scan-action@v7
        with:
          image: ai-engkit-ai-v2dev
          output-format: sarif
          output-file: grype-v2-results.sarif
          severity-cutoff: critical
          fail-build: false

      - name: Gate V2 scan against baseline
        id: gate
        run: bash .github/scripts/grype-release-check.sh grype-v2-candidate-results.json grype-v2-baseline-results.json

      - name: Upload V2 Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-v2-results.sarif
          category: sca-grype-v2

  push-v2:
    name: Push V2 Image to GHCR
    needs: [test-v2, scan-v2]
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', vars.V2_BRANCH) || startsWith(github.ref, 'refs/tags/v2.'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download V2 image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-v2
          path: /tmp

      - name: Load V2 image
        run: docker load -i /tmp/image-v2.tar

      # Branch pushes stamp v2-dev; release tags stamp the formal version so the Admin Dashboard reports it.
      - name: Inject version into image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v2.* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v2-dev"
          fi
          printf '%s' "${VERSION}" > /tmp/ai-engkit-version
          docker create --name tmp-v2 ai-engkit-ai-v2dev
          docker cp /tmp/ai-engkit-version tmp-v2:/opt/ai-engkit/VERSION
          docker commit tmp-v2 ai-engkit-ai-v2dev > /dev/null
          docker rm -f tmp-v2 > /dev/null
          echo "::notice::Injected version: ${VERSION}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A v2.* tag publishes the immutable release tag; a branch push publishes
      # the rolling :v2-dev channel. :v2 itself is only moved by promote.yml.
      - name: Tag and push V2 image
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          docker tag ai-engkit-ai-v2dev "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:sha-${{ github.sha }}"
          if [[ "$GITHUB_REF" == refs/tags/v2.* ]]; then
            docker tag ai-engkit-ai-v2dev "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          else
            docker tag ai-engkit-ai-v2dev "${IMAGE}:v2-dev"
            docker push "${IMAGE}:v2-dev"
          fi

  release-v2:
    name: Create V2 Release
    needs: [push-v2, test-v2, scan-v2]
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate V2 Release Body
        id: body
        env:
          CRITICAL_COUNT: ${{ needs.scan-v2.outputs.critical-count }}
          HIGH_COUNT: ${{ needs.scan-v2.outputs.high-count }}
          MEDIUM_COUNT: ${{ needs.scan-v2.outputs.medium-count }}
          LOW_COUNT: ${{ needs.scan-v2.outputs.low-count }}
        run: |
          bash .github/scripts/release-body.sh \
            "${{ github.ref_name }}" \
            "Generated by GitHub Actions" \
            "${{ needs.scan-v2.outputs.critical-count }}"

      - name: Create V2 Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.body.outputs.body }}
